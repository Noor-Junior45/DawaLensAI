<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="0.75" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" rx="24" />
  <rect width="1200" height="480" fill="url(#grid)" rx="24" />

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="240" r="160" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="920" cy="200" r="180" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />

  <!-- Left Side: Shield & Medical Emblem -->
  <g transform="translate(180, 100)">
    <!-- Base Glow -->
    <path d="M120 20 L220 60 L220 180 C220 260 120 310 120 310 C120 310 20 260 20 180 L20 60 Z" fill="#10b981" opacity="0.2" filter="url(#glow)" />
    
    <!-- Outer Shield -->
    <path d="M120 20 L220 60 L220 180 C220 260 120 310 120 310 C120 310 20 260 20 180 L20 60 Z" fill="url(#shieldGrad)" />
    
    <!-- Inner Shield Inset -->
    <path d="M120 40 L200 75 L200 175 C200 240 120 282 120 282 C120 282 40 240 40 175 L40 75 Z" fill="#ffffff" opacity="0.15" />

    <!-- Medical Cross with Rounded Edges -->
    <path d="M102 100 H138 V136 H174 V172 H138 V208 H102 V172 H66 V136 H102 Z" fill="#ffffff" />

    <!-- Padlock Overlay Badge -->
    <g transform="translate(160, 200)">
      <circle cx="36" cy="36" r="36" fill="#0f172a" />
      <circle cx="36" cy="36" r="32" fill="#1e293b" />
      <!-- Lock Shackle -->
      <path d="M28 32 V24 C28 19.5 31.5 16 36 16 C40.5 16 44 19.5 44 24 V32" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
      <!-- Lock Body -->
      <rect x="23" y="30" width="26" height="20" rx="4" fill="#10b981" />
      <circle cx="36" cy="39" r="2.5" fill="#064e3b" />
      <path d="M36 41.5 V46" stroke="#064e3b" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Right Side: Clean Regulatory Typography & Badges -->
  <g transform="translate(520, 110)">
    <!-- Compliance Category Header -->
    <rect x="0" y="10" width="260" height="32" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
    <circle cx="16" cy="26" r="5" fill="#059669" />
    <text x="30" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#065f46" letter-spacing="1">
      GLOBAL PRIVACY COMPLIANT
    </text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
      Data Safety &amp; Legal Protection
    </text>

    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#475569">
      DawaSnap AI Pharmaceutical Vault &amp; Clinical Scanner
    </text>

    <!-- 3 Pillars Row -->
    <g transform="translate(0, 155)">
      <!-- Pillar 1: On-Device OCR -->
      <g transform="translate(0, 0)">
        <rect width="180" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
        <circle cx="28" cy="28" r="14" fill="#ecfdf5" />
        <path d="M22 28 L26 32 L34 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">On-Device OCR</text>
        <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748b">Zero Cloud Image Upload</text>
        <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#059669">100% Local Processing</text>
      </g>

      <!-- Pillar 2: Zero Data Sale -->
      <g transform="translate(195, 0)">
        <rect width="180" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
        <circle cx="28" cy="28" r="14" fill="#eff6ff" />
        <path d="M28 20 C23.5 20 20 23.5 20 28 C20 32.5 23.5 36 28 36 C32.5 36 36 32.5 36 28 C36 23.5 32.5 20 28 20 Z M22 22 L34 34" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
        <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Zero Data Sale</text>
        <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748b">No Third-Party Brokers</text>
        <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#2563eb">De-Identified SLM Model</text>
      </g>

      <!-- Pillar 3: Statutory Rights -->
      <g transform="translate(390, 0)">
        <rect width="180" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
        <circle cx="28" cy="28" r="14" fill="#faf5ff" />
        <path d="M23 33 L28 23 L33 33 Z M25 30 H31" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Statutory Rights</text>
        <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748b">Google Play, DPDP &amp; GDPR</text>
        <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#7c3aed">Instant 1-Click Erasure</text>
      </g>
    </g>

    <!-- Small legal footprint text -->
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
      Formal Agreement ID: DAWASNAP-PRIVACY-2026-V2 &bull; Controller: MD NOOR HASSAN
    </text>
  </g>
</svg>
